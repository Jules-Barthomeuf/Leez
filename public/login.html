<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leez — Connexion</title>
<link rel="stylesheet" href="/css/leez.css">
<link rel="stylesheet" href="/css/login.css">
</head>
<body>

<div class="login-shell">
  <div class="login-card">
    <a class="login-logo" href="/">Leez</a>
    <h1>Connexion</h1>
    <p class="login-sub">Accédez à l'espace de travail de votre fonds.</p>

    <form id="loginForm" novalidate>
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" name="email" autocomplete="username" required>

      <label for="loginPassword">Mot de passe</label>
      <div class="password-field">
        <input type="password" id="loginPassword" name="password" autocomplete="current-password" required>
        <button type="button" class="password-toggle" data-toggle-password="loginPassword" aria-label="Afficher le mot de passe">
          <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M3 3l18 18"/><path d="M10.6 10.6a3 3 0 0 0 4.24 4.24"/><path d="M9.88 4.24A11.6 11.6 0 0 1 12 4c6.5 0 10.5 8 10.5 8a13.7 13.7 0 0 1-3.15 4.31M6.1 6.1A13.7 13.7 0 0 0 1.5 12s4 8 10.5 8a10.9 10.9 0 0 0 4.32-.86"/></svg>
        </button>
      </div>

      <div class="login-error" id="loginError" style="display:none;"></div>

      <button type="submit" class="btn btn-solid login-submit" id="loginSubmit">Se connecter</button>
    </form>

    <div class="login-divider" id="loginGoogleDivider" style="display:none;"><span>ou</span></div>
    <a class="btn btn-outline login-google-btn" id="loginGoogleBtn" href="/api/auth/google" style="display:none;">
      <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.68-3.87 2.68-6.62z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.83.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
      </svg>
      Se connecter avec Google
    </a>

    <div class="login-error" id="loginErrorRedirect" style="display:none;"></div>

    <p class="login-footnote">Pas de compte ? <a href="/signup.html">Créer un compte</a></p>
  </div>
</div>

<script src="/js/login.js"></script>
</body>
</html>
